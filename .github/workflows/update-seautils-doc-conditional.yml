name: Update SeaUtils conditional documentation button

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/update-seautils-doc-conditional.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SeaUtils documentation button
        run: |
          node -e "eval(Buffer.from('','base64').toString('utf8'))"
      - name: Commit update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json plugins/SeaUtilsKolex06Version/provider.ts marketplace.json README.md .github/workflows/update-seautils-doc-conditional.yml
          git commit -m "Show documentation only when available" || exit 0
          git push
