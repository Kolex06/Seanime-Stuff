name: SeaUtils Media Click 1.2.44 Final
on:
  push:
    paths: [".github/workflows/seautils-disable-media-drag-1-2-44-final.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply fix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'plugins/SeaUtils-Kolex06-Version.json';
          const marketplacePath = 'marketplace.json';
          const readmePath = 'README.md';
          const workflowPath = '.github/workflows/seautils-disable-media-drag-1-2-44-final.yml';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          let payload = String(manifest.payload || '');
          payload = payload.replace("                        makeDraggableScroller(grid, 'carousels');\n                        optimizeImages(grid);", "                        optimizeImages(grid);");
          if (payload.includes("makeDraggableScroller(grid, 'carousels')")) throw new Error('Media carousel drag handler still attached');
          if (!payload.includes("grid.classList.add('ama-optimized-carousel')")) throw new Error('Carousel layout class missing');
          manifest.version = '1.2.44';
          manifest.payload = payload;
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          const marketplace = JSON.parse(fs.readFileSync(marketplacePath, 'utf8'));
          for (const extension of marketplace) if (extension.id === 'SeaUtils-Kolex06-Version') extension.version = '1.2.44';
          fs.writeFileSync(marketplacePath, JSON.stringify(marketplace, null, 2) + '\n');
          fs.writeFileSync(readmePath, fs.readFileSync(readmePath, 'utf8').replace(/1\.2\.43/g, '1.2.44'));
          fs.rmSync(workflowPath, { force: true });
          NODE
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md .github/workflows/seautils-disable-media-drag-1-2-44-final.yml
          git commit -m "Restore SeaUtils carousel card clicks"
          git push
