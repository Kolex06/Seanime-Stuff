name: SeaUtils Raw Restore 1.2.46
on:
  push:
    paths: [".github/workflows/seautils-raw-restore-1-2-46.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'plugins/SeaUtils-Kolex06-Version.json';
          const marketplacePath = 'marketplace.json';
          const readmePath = 'README.md';
          const workflowPath = '.github/workflows/seautils-raw-restore-1-2-46.yml';
          const rawUri = 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/refs/heads/main/plugins/SeaUtils-Kolex06-Version.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          let payload = String(manifest.payload || '');
          payload = payload.replace(
            /                        el\.addEventListener\('click', event => \{\n[\s\S]*?                        \}, true\);\n\n                        el\.addEventListener\('dragstart'/,
            "                        el.addEventListener('click', event => {\n                            suppressClick = false;\n                            didDrag = false;\n                        }, true);\n\n                        el.addEventListener('dragstart'"
          );
          if (!payload.includes("makeDraggableScroller(grid, 'carousels')")) {
            payload = payload.replace("                        optimizeImages(grid);\n                    }", "                        makeDraggableScroller(grid, 'carousels');\n                        optimizeImages(grid);\n                    }");
          }
          if (!payload.includes("makeDraggableScroller(grid, 'carousels')")) throw new Error('Media carousel drag missing');
          if (!payload.includes("suppressClick = false;\n                            didDrag = false;\n                        }, true);")) throw new Error('Click neutralizer missing');
          manifest.version = '1.2.46';
          manifest.manifestURI = rawUri;
          manifest.payload = payload;
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          const marketplace = JSON.parse(fs.readFileSync(marketplacePath, 'utf8'));
          for (const extension of marketplace) {
            if (extension.id === 'SeaUtils-Kolex06-Version') {
              extension.version = '1.2.46';
              extension.manifestURI = rawUri;
            }
          }
          fs.writeFileSync(marketplacePath, JSON.stringify(marketplace, null, 2) + '\n');
          fs.writeFileSync(readmePath, fs.readFileSync(readmePath, 'utf8').replace(/1\.2\.43|1\.2\.44|1\.2\.45/g, '1.2.46').replace(/https:\/\/cdn\.jsdelivr\.net\/gh\/Kolex06\/Seanime-Stuff@main\/plugins\/SeaUtils-Kolex06-Version\.json/g, rawUri));
          fs.rmSync(workflowPath, { force: true });
          NODE
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md .github/workflows/seautils-raw-restore-1-2-46.yml
          git commit -m "Use raw SeaUtils manifest and restore click behavior"
          git push
