name: One-time SeaUtils old provider restore

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seautils-restore-old-provider.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore old working SeaUtils provider
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = '1.2.30';
          const payload = JSON.parse(fs.readFileSync('plugins/SeaUtils.json', 'utf8')).payload;

          fs.mkdirSync('plugins/SeaUtilsKolex06Version', { recursive: true });
          fs.writeFileSync('plugins/SeaUtilsKolex06Version/provider.ts', payload);

          const manifest = {
            id: 'SeaUtils-Kolex06-Version',
            name: 'SeaUtils Kolex06-Version',
            version,
            manifestURI: 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/refs/heads/main/plugins/SeaUtils-Kolex06-Version.json',
            language: 'typescript',
            type: 'plugin',
            description: 'A utility plugin to enhance seanime.',
            author: 'Kolex06',
            icon: 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/main/icons/SeaUtils-Kolex06-Version.png',
            website: '',
            readme: '',
            lang: 'en',
            payload,
            payloadURI: 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/refs/heads/main/plugins/SeaUtilsKolex06Version/provider.ts',
            plugin: {
              version: '1',
              permissions: {
                scopes: ['storage'],
                allow: {
                  unsafeFlags: [
                    {
                      flag: 'dom-script-manipulation',
                      reason: 'Required to inject custom search bars and modals'
                    }
                  ],
                  networkAccess: {
                    allowedDomains: ['raw.githubusercontent.com'],
                    reasoning: 'Required to load the SeaUtils tray icon from GitHub raw.'
                  }
                }
              }
            }
          };
          fs.writeFileSync('plugins/SeaUtils-Kolex06-Version.json', JSON.stringify(manifest, null, 2) + '\n');

          const marketplace = JSON.parse(fs.readFileSync('marketplace.json', 'utf8'));
          const seaUtils = marketplace.find(item => item.id === 'SeaUtils-Kolex06-Version');
          if (!seaUtils) throw new Error('SeaUtils marketplace entry not found');
          seaUtils.version = version;
          fs.writeFileSync('marketplace.json', JSON.stringify(marketplace, null, 2) + '\n');

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = readme.replace(/\| SeaUtils Kolex06-Version \| [^|]+ \| `SeaUtils-Kolex06-Version` \|/, `| SeaUtils Kolex06-Version | ${version} | \`SeaUtils-Kolex06-Version\` |`);
          fs.writeFileSync('README.md', readme);

          fs.rmSync('.github/workflows/seautils-restore-old-provider.yml', { force: true });
          NODE
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtilsKolex06Version/provider.ts plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md .github/workflows/seautils-restore-old-provider.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore old working SeaUtils provider"
            git push
          fi
