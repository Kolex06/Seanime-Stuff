name: Fix SeaUtils Kolex06 manifest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-seautils-kolex.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write fixed SeaUtils manifest
        run: |
          cat > /tmp/fixed-manifest.json.gz.b64 <<'B64'
          
          B64

          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');

          const fixedId = 'SeaUtils-Kolex06-Version';
          const fixedName = 'SeaUtils Kolex06-Version';
          const fixedVersion = '1.2.15';
          const manifestURI = 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/main/plugins/SeaUtils-Kolex06-Version.json';
          const iconURI = 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/main/icons/SeaUtils-Kolex06-Version.svg';

          const encoded = fs.readFileSync('/tmp/fixed-manifest.json.gz.b64', 'utf8').replace(/\s+/g, '');
          const manifest = JSON.parse(zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8').replace(/^\uFEFF/, ''));

          manifest.id = fixedId;
          manifest.name = fixedName;
          manifest.version = fixedVersion;
          manifest.manifestURI = manifestURI;
          manifest.author = 'Kolex06';
          manifest.icon = iconURI;

          if (typeof manifest.payload === 'string') {
            manifest.payload = manifest.payload
              .replaceAll('https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/refs/heads/main/icons/seautils.svg', iconURI)
              .replaceAll('https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/refs/heads/main/icons/seautils.png', iconURI)
              .replaceAll('https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/refs/heads/main/plugins/SeaUtils.json', manifestURI)
              .replaceAll('https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/main/icons/seautils.svg', iconURI)
              .replaceAll('https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/main/icons/seautils.png', iconURI)
              .replaceAll('https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/main/plugins/SeaUtils.json', manifestURI);
          }

          fs.writeFileSync('plugins/SeaUtils-Kolex06-Version.json', JSON.stringify(manifest, null, 2) + '\n');

          const marketplacePath = 'marketplace.json';
          const marketplace = JSON.parse(fs.readFileSync(marketplacePath, 'utf8'));
          const entry = marketplace.find(item => item && (
            item.id === fixedId ||
            item.id === 'seautils' ||
            String(item.name || '').toLowerCase().includes('seautils')
          ));

          if (!entry) throw new Error('SeaUtils marketplace entry not found');

          entry.id = fixedId;
          entry.name = fixedName;
          entry.version = fixedVersion;
          entry.manifestURI = manifestURI;
          entry.author = 'Kolex06';
          entry.icon = iconURI;
          fs.writeFileSync(marketplacePath, JSON.stringify(marketplace, null, 2) + '\n');

          const readmePath = 'README.md';
          if (fs.existsSync(readmePath)) {
            const readme = fs.readFileSync(readmePath, 'utf8')
              .replace(/- SeaUtils(?: Kolex06-Version)?/g, '- SeaUtils Kolex06-Version');
            fs.writeFileSync(readmePath, readme);
          }

          const workflowPath = '.github/workflows/fix-seautils-kolex.yml';
          if (fs.existsSync(workflowPath)) fs.rmSync(workflowPath);
          NODE

      - name: Commit fixed files and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md .github/workflows/fix-seautils-kolex.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix SeaUtils Kolex06 manifest"
            git push
          fi
