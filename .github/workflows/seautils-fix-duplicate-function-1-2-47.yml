name: SeaUtils Duplicate Function Fix 1.2.47
on:
  push:
    paths: [".github/workflows/seautils-fix-duplicate-function-1-2-47.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'plugins/SeaUtils-Kolex06-Version.json';
          const marketplacePath = 'marketplace.json';
          const readmePath = 'README.md';
          const workflowPath = '.github/workflows/seautils-fix-duplicate-function-1-2-47.yml';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          let payload = String(manifest.payload || '');
          payload = payload.replace('function areCarouselsEnabledForCurrentPage() {                    function areCarouselsEnabledForCurrentPage() {', 'function areCarouselsEnabledForCurrentPage() {');
          if (payload.includes('function areCarouselsEnabledForCurrentPage() {                    function areCarouselsEnabledForCurrentPage() {')) throw new Error('Duplicate function header still present');
          manifest.version = '1.2.47';
          manifest.payload = payload;
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          const marketplace = JSON.parse(fs.readFileSync(marketplacePath, 'utf8'));
          for (const extension of marketplace) if (extension.id === 'SeaUtils-Kolex06-Version') extension.version = '1.2.47';
          fs.writeFileSync(marketplacePath, JSON.stringify(marketplace, null, 2) + '\n');
          fs.writeFileSync(readmePath, fs.readFileSync(readmePath, 'utf8').replace(/1\.2\.45|1\.2\.46/g, '1.2.47'));
          fs.rmSync(workflowPath, { force: true });
          NODE
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md .github/workflows/seautils-fix-duplicate-function-1-2-47.yml
          git commit -m "Fix SeaUtils browser script syntax"
          git push
