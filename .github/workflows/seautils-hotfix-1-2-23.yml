name: SeaUtils hotfix 1.2.23

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seautils-hotfix-1-2-23.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-seautils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SeaUtils
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          version = '1.2.23'
          provider_path = Path('plugins/SeaUtilsKolex06Version/provider.ts')
          manifest_path = Path('plugins/SeaUtils-Kolex06-Version.json')
          marketplace_path = Path('marketplace.json')
          readme_path = Path('README.md')

          provider = provider_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          provider = re.sub(r"const marketplaceEnhancementVersion = 'v\d+';", "const marketplaceEnhancementVersion = 'v10';", provider, count=1)

          old_prefs = """                    async function hasPreferencesForCard(card) {
                        const extension = await findExtensionForCard(card);
                        return !!(extension && extension.userConfig);
                    }"""
          new_prefs = """                    async function hasPreferencesForCard(card) {
                        try {
                            const extension = await findExtensionForCard(card);
                            return !!(extension && extension.userConfig);
                        } catch (_) {
                            return false;
                        }
                    }"""
          provider = provider.replace(old_prefs, new_prefs, 1)

          old_docs = """                    async function hasDocumentationForCard(card) {
                        const extension = await findExtensionForCard(card);
                        return !!getExtensionDocumentationUrl(extension);
                    }"""
          new_docs = """                    async function hasDocumentationForCard(card) {
                        try {
                            const extension = await findExtensionForCard(card);
                            return !!getExtensionDocumentationUrl(extension);
                        } catch (_) {
                            return false;
                        }
                    }"""
          provider = provider.replace(old_docs, new_docs, 1)

          if "const marketplaceEnhancementVersion = 'v10';" not in provider:
              raise SystemExit('SeaUtils enhancement version was not updated')
          if "async function hasDocumentationForCard(card) {\n                        try {" not in provider:
              raise SystemExit('SeaUtils documentation check was not made fail-safe')
          if "async function hasPreferencesForCard(card) {\n                        try {" not in provider:
              raise SystemExit('SeaUtils preferences check was not made fail-safe')

          provider = provider.rstrip()
          provider_path.write_text(provider + '\n', encoding='utf-8')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = version
          manifest['payload'] = provider
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          marketplace = json.loads(marketplace_path.read_text(encoding='utf-8'))
          for item in marketplace:
              if item.get('id') == 'SeaUtils-Kolex06-Version':
                  item['version'] = version
                  break
          else:
              raise SystemExit('SeaUtils marketplace entry not found')
          marketplace_path.write_text(json.dumps(marketplace, indent=2) + '\n', encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(r'(\| SeaUtils Kolex06-Version \| )[^|]+( \| `SeaUtils-Kolex06-Version` \|)', r'\g<1>' + version + r'\g<2>', readme, count=1)
          readme_path.write_text(readme, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtilsKolex06Version/provider.ts plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md
          git diff --cached --quiet || git commit -m "Fix SeaUtils docs button runtime"
          git push
