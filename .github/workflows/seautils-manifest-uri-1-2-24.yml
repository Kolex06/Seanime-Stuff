name: SeaUtils manifest URI 1.2.24

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seautils-manifest-uri-1-2-24.yml
      - tools/seautils_manifest_uri_1_2_24.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-seautils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SeaUtils manifest URI
        run: python3 tools/seautils_manifest_uri_1_2_24.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md
          git diff --cached --quiet || git commit -m "Use refs raw URL for SeaUtils manifest"
          git push
