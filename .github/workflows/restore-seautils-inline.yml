name: Restore SeaUtils Inline Manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-seautils-inline
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore SeaUtils inline manifest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const vm = require('vm');

          const VERSION = '1.2.33';
          const LEGACY_URL = 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/b9b9b0ddabcf3bd4d93cdee04e9155644707fe35/plugins/SeaUtils-Kolex06-Version.json';
          const MANIFEST_URI = 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/refs/heads/main/plugins/SeaUtils-Kolex06-Version.json';
          const ICON_URL = 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/main/icons/SeaUtils-Kolex06-Version.png';
          const TRAY_ICON_URL = 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/refs/heads/main/icons/SeaUtils-Kolex06-Version.png';

          function fetchText(url) {
            return new Promise((resolve, reject) => {
              https.get(url, response => {
                if (response.statusCode < 200 || response.statusCode >= 300) {
                  reject(new Error(`HTTP ${response.statusCode} for ${url}`));
                  response.resume();
                  return;
                }

                let body = '';
                response.setEncoding('utf8');
                response.on('data', chunk => body += chunk);
                response.on('end', () => resolve(body));
              }).on('error', reject);
            });
          }

          function extractTemplate(source, startNeedle, endNeedle) {
            const start = source.indexOf(startNeedle);
            if (start < 0) throw new Error(`Missing ${startNeedle}`);
            const bodyStart = start + startNeedle.length;
            const end = source.indexOf(endNeedle, bodyStart);
            if (end < 0) throw new Error(`Missing end for ${startNeedle}`);
            return source.slice(bodyStart, end);
          }

          (async () => {
            const manifest = JSON.parse(await fetchText(LEGACY_URL));

            manifest.id = 'SeaUtils-Kolex06-Version';
            manifest.name = 'SeaUtils Kolex06-Version';
            manifest.version = VERSION;
            manifest.manifestURI = MANIFEST_URI;
            manifest.author = 'Kolex06';
            manifest.icon = ICON_URL;
            manifest.website = manifest.website || '';
            manifest.readme = manifest.readme || '';
            manifest.lang = manifest.lang || 'en';
            delete manifest.payloadURI;
            delete manifest.payloadURL;

            manifest.payload = String(manifest.payload || '')
              .replace(/https:\/\/raw\.githubusercontent\.com\/Kolex06\/Seanime-Stuff\/refs\/heads\/main\/icons\/seautils\.svg/g, TRAY_ICON_URL)
              .replace(/https:\/\/raw\.githubusercontent\.com\/Kolex06\/Seanime-Stuff\/main\/icons\/seautils\.svg/g, ICON_URL)
              .replace(/https:\/\/raw\.githubusercontent\.com\/Kolex06\/Seanime-Stuff\/main\/icons\/SeaUtils-Kolex06-Version\.png/g, ICON_URL);

            const source = manifest.payload.replace(/\r\n/g, '\n');
            const runtime = Function(
              'initialFeatureSettings',
              'return `' + extractTemplate(source, 'script.setText(`', '\n            `);').replace(/`/g, '\\`') + '`;'
            )({ betterMarketplace: true, carousels: true, subDubIcons: true });
            new vm.Script(runtime);

            if (!manifest.payload.includes('makeDraggableScroller')) throw new Error('Missing drag code');
            if (!manifest.payload.includes("const marketplaceEnhancementVersion = 'v5'")) throw new Error('Missing old marketplace v5 code');
            if (Object.prototype.hasOwnProperty.call(manifest, 'payloadURI')) throw new Error('payloadURI was not removed');

            fs.writeFileSync('plugins/SeaUtils-Kolex06-Version.json', JSON.stringify(manifest, null, 2) + '\n');

            const marketplace = JSON.parse(fs.readFileSync('marketplace.json', 'utf8'));
            const entry = marketplace.find(item => item.id === 'SeaUtils-Kolex06-Version');
            if (entry) {
              entry.name = 'SeaUtils Kolex06-Version';
              entry.version = VERSION;
              entry.manifestURI = MANIFEST_URI;
              entry.author = 'Kolex06';
              entry.icon = ICON_URL;
            }
            fs.writeFileSync('marketplace.json', JSON.stringify(marketplace, null, 2) + '\n');

            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(/SeaUtils Kolex06-Version \| 1\.2\.\d+/g, `SeaUtils Kolex06-Version | ${VERSION}`);
            readme = readme.replace(
              /Source code:\n\n```text\nhttps:\/\/github\.com\/Kolex06\/Seanime-Stuff\/blob\/main\/plugins\/SeaUtilsKolex06Version\/provider\.ts\n```/,
              'Source code:\n\n```text\nhttps://github.com/Kolex06/Seanime-Stuff/blob/main/plugins/SeaUtils-Kolex06-Version.json\n```'
            );
            readme = readme.replace(
              /- Use `SeaUtils-Kolex06-Version\.json` for SeaUtils Kolex06-Version\. .*\n/,
              '- Use `SeaUtils-Kolex06-Version.json` for SeaUtils Kolex06-Version. The manifest contains the restored old working SeaUtils code directly.\n'
            );
            readme = readme.replace(/  SeaUtilsKolex06Version\/\n    provider\.ts\n/g, '');
            fs.writeFileSync('README.md', readme);

            fs.rmSync('plugins/SeaUtilsKolex06Version', { recursive: true, force: true });
            fs.rmSync('.github/workflows/restore-seautils-inline.yml', { force: true });
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Commit restored inline SeaUtils
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md plugins/SeaUtilsKolex06Version .github/workflows/restore-seautils-inline.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore SeaUtils inline manifest"
            git push
          fi
