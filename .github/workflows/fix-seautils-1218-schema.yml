name: Fix SeaUtils 1.2.18 schema

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-seautils-1218-schema.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep SeaUtils at 1.2.18 with valid network schema
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pluginPath = 'plugins/SeaUtils-Kolex06-Version.json';
          const marketplacePath = 'marketplace.json';
          const workflowPath = '.github/workflows/fix-seautils-1218-schema.yml';
          const version = '1.2.18';
          const id = 'SeaUtils-Kolex06-Version';
          const name = 'SeaUtils Kolex06-Version';
          const manifestURI = 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/main/plugins/SeaUtils-Kolex06-Version.json';
          const icon = 'https://raw.githubusercontent.com/Kolex06/Seanime-Stuff/main/icons/SeaUtils-Kolex06-Version.png';

          function readJson(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8').replace(/^\uFEFF/, ''));
          }

          function writeJson(path, value) {
            fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          }

          const manifest = readJson(pluginPath);
          manifest.id = id;
          manifest.name = name;
          manifest.version = version;
          manifest.manifestURI = manifestURI;
          manifest.author = 'Kolex06';
          manifest.icon = icon;

          manifest.plugin = manifest.plugin || {};
          manifest.plugin.version = manifest.plugin.version || '1';
          manifest.plugin.permissions = manifest.plugin.permissions || {};
          manifest.plugin.permissions.allow = manifest.plugin.permissions.allow || {};
          manifest.plugin.permissions.allow.networkAccess = manifest.plugin.permissions.allow.networkAccess || {};
          manifest.plugin.permissions.allow.networkAccess.allowedDomains = ['raw.githubusercontent.com'];
          manifest.plugin.permissions.allow.networkAccess.reasoning = 'Required to load the SeaUtils tray icon PNG from GitHub raw.';

          writeJson(pluginPath, manifest);

          const marketplace = readJson(marketplacePath);
          const entries = Array.isArray(marketplace)
            ? marketplace
            : Array.isArray(marketplace.extensions)
              ? marketplace.extensions
              : Array.isArray(marketplace.plugins)
                ? marketplace.plugins
                : [];
          const entry = entries.find((item) => item && (item.id === id || item.name === name));
          if (entry) {
            entry.id = id;
            entry.name = name;
            entry.version = version;
            entry.manifestURI = manifestURI;
            entry.author = 'Kolex06';
            entry.icon = icon;
          }
          writeJson(marketplacePath, marketplace);

          fs.rmSync(workflowPath, { force: true });
          NODE
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json .github/workflows/fix-seautils-1218-schema.yml
          git commit -m "Fix SeaUtils 1.2.18 network schema" || exit 0
          git push
