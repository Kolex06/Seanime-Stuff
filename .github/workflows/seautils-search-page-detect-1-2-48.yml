name: SeaUtils Search Page Detect 1.2.48
on:
  push:
    paths: [".github/workflows/seautils-search-page-detect-1-2-48.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'plugins/SeaUtils-Kolex06-Version.json';
          const marketplacePath = 'marketplace.json';
          const readmePath = 'README.md';
          const workflowPath = '.github/workflows/seautils-search-page-detect-1-2-48.yml';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          let payload = String(manifest.payload || '');
          const oldText = `                    function hasSearchPageSignal() {
                        const path = String(window.location.pathname || '').toLowerCase();
                        const hash = String(window.location.hash || '').toLowerCase();
                        const combined = path + ' ' + hash;

                        if (/(^|[\\/#?&=-])search($|[\\/#?&=-])/.test(combined)) return true;
                        return false;
                    }
`;
          const newText = `                    function hasSearchPageSignal() {
                        const path = String(window.location.pathname || '').toLowerCase();
                        const search = String(window.location.search || '').toLowerCase();
                        const hash = String(window.location.hash || '').toLowerCase();
                        const combined = path + ' ' + search + ' ' + hash;

                        if (/(^|[\\/#?&=-])search($|[\\/#?&=-])/.test(combined)) return true;
                        if (document.querySelector('[data-search-page-container], [data-search-page-title], [data-search-page-list]')) return true;

                        return false;
                    }
`;
          if (!payload.includes(newText)) {
            if (!payload.includes(oldText)) throw new Error('Old search detector not found');
            payload = payload.replace(oldText, newText);
          }
          if (!payload.includes('data-search-page-container')) throw new Error('DOM search detector missing');
          manifest.version = '1.2.48';
          manifest.payload = payload;
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          const marketplace = JSON.parse(fs.readFileSync(marketplacePath, 'utf8'));
          for (const extension of marketplace) if (extension.id === 'SeaUtils-Kolex06-Version') extension.version = '1.2.48';
          fs.writeFileSync(marketplacePath, JSON.stringify(marketplace, null, 2) + '\n');
          fs.writeFileSync(readmePath, fs.readFileSync(readmePath, 'utf8').replace(/1\.2\.47/g, '1.2.48'));
          fs.rmSync(workflowPath, { force: true });
          NODE
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md .github/workflows/seautils-search-page-detect-1-2-48.yml
          git commit -m "Fix SeaUtils search carousel page detection"
          git push
# trigger: 2
