name: Update SeaUtils Full Catalog actions

on:
  push:
    paths:
      - .github/workflows/update-seautils-full-catalog-actions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch SeaUtils manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const manifestPath = 'plugins/SeaUtils-Kolex06-Version.json';
          const marketplacePath = 'marketplace.json';

          function readJson(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          }

          function writeJson(path, value) {
            fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          }

          function replaceOnce(value, needle, replacement, label) {
            if (!value.includes(needle)) throw new Error('Could not find ' + label);
            return value.replace(needle, replacement);
          }

          const manifest = readJson(manifestPath);
          const marketplace = readJson(marketplacePath);

          manifest.version = '1.2.20';
          for (const entry of marketplace) {
            if (entry && entry.id === 'SeaUtils-Kolex06-Version') entry.version = '1.2.20';
          }

          let payload = manifest.payload;

          payload = payload.replace(
            /const SETTINGS_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">.*?<\/svg>';/,
            'const SETTINGS_ICON = \'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>\';'
          );

          if (!payload.includes('const DOCUMENTATION_ICON')) {
            payload = replaceOnce(
              payload,
              'const CODE_ICON = \'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"></path><path d="m8 6-6 6 6 6"></path></svg>\';\n                    const SETTINGS_ICON',
              'const CODE_ICON = \'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"></path><path d="m8 6-6 6 6 6"></path></svg>\';\n                    const DOCUMENTATION_ICON = \'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>\';\n                    const SETTINGS_ICON',
              'documentation icon'
            );
          }

          payload = payload.replace(/const marketplaceEnhancementVersion = 'v\d+';/, "const marketplaceEnhancementVersion = 'v8';");

          payload = replaceOnce(
            payload,
            `            body[data-ama-better-marketplace="true"] .ama-clone-actions {
                position: absolute !important;
                top: 12px !important;
                right: 12px !important;
                display: flex !important;
                flex-direction: column !important;
                gap: 4px !important;
                z-index: 9999999 !important;
                pointer-events: auto !important;
            }
`,
            `            body[data-ama-better-marketplace="true"] .ama-clone-actions {
                position: absolute !important;
                top: 12px !important;
                right: 12px !important;
                display: grid !important;
                grid-template-columns: repeat(2, 32px) !important;
                gap: 4px !important;
                z-index: 9999999 !important;
                pointer-events: auto !important;
            }

            body[data-ama-better-marketplace="true"] .ama-clone-action[data-ama-action="more"] {
                grid-column: 1 !important;
                grid-row: 1 !important;
            }

            body[data-ama-better-marketplace="true"] .ama-clone-action[data-ama-action="preferences"] {
                grid-column: 2 !important;
                grid-row: 1 !important;
            }

            body[data-ama-better-marketplace="true"] .ama-clone-action[data-ama-action="code"] {
                grid-column: 1 !important;
                grid-row: 2 !important;
            }

            body[data-ama-better-marketplace="true"] .ama-clone-action[data-ama-action="documentation"] {
                grid-column: 2 !important;
                grid-row: 2 !important;
            }

            body[data-ama-better-marketplace="true"] .ama-clone-action[data-ama-action="download"] {
                grid-column: 1 !important;
                grid-row: 1 !important;
            }
`,
            'clone action grid styles'
          );

          if (!payload.includes('function getExtensionDocumentationUrl')) {
            const documentationFunctions = `
                    function getExtensionDocumentationUrl(extension) {
                        if (!extension) return '';

                        return extension.readme ||
                            extension.readmeURL ||
                            extension.readmeUrl ||
                            extension.documentation ||
                            extension.documentationURL ||
                            extension.documentationUrl ||
                            extension.docs ||
                            extension.website ||
                            '';
                    }

                    async function hasDocumentationForCard(card) {
                        const extension = await findExtensionForCard(card);
                        return !!getExtensionDocumentationUrl(extension);
                    }

                    async function showInstalledDocumentation(card) {
                        const data = getExtensionCardData(card);
                        const modal = openAmaModal('Documentation', '<p>Loading documentation for ' + escapeHtml(data.name) + '...</p>');

                        try {
                            const extension = await findExtensionForCard(card);
                            const documentationUrl = getExtensionDocumentationUrl(extension);

                            if (!documentationUrl) {
                                throw new Error('This extension has no documentation.');
                            }

                            if (/\\.md(?:$|[?#])|raw\\.githubusercontent\\.com/i.test(documentationUrl)) {
                                const response = await fetch(documentationUrl, {
                                    cache: 'no-store'
                                });

                                if (!response.ok) {
                                    throw new Error('Could not load documentation.');
                                }

                                const text = await response.text();
                                modal.innerHTML =
                                    '<button type="button" class="ama-modal-close">Close</button>' +
                                    '<h2 style="margin-top:0; margin-bottom:16px; font-size:32px;">Documentation</h2>' +
                                    '<p style="color:rgba(255,255,255,.65); margin:0;">' + escapeHtml((extension && extension.name) || data.name) + '</p>' +
                                    '<pre class="ama-code-preview">' + escapeHtml(text || 'No documentation found.') + '</pre>';
                                bindAmaModalClose(modal);
                                return;
                            }

                            modal.innerHTML =
                                '<button type="button" class="ama-modal-close">Close</button>' +
                                '<h2 style="margin-top:0; margin-bottom:16px; font-size:32px;">Documentation</h2>' +
                                '<p style="color:rgba(255,255,255,.65); margin:0 0 16px 0;">' + escapeHtml((extension && extension.name) || data.name) + '</p>' +
                                '<a class="ama-action-button" href="' + escapeHtml(documentationUrl) + '" target="_blank" rel="noopener noreferrer">Open documentation</a>';
                            bindAmaModalClose(modal);
                        } catch (error) {
                            modal.innerHTML =
                                '<button type="button" class="ama-modal-close">Close</button>' +
                                '<h2 style="margin-top:0; margin-bottom:16px; font-size:32px;">Documentation</h2>' +
                                '<p>' + escapeHtml(error && error.message ? error.message : 'Could not load documentation for this extension.') + '</p>';
                            bindAmaModalClose(modal);
                        }
                    }
`;
            payload = replaceOnce(payload, '\n                    function readMarketplaceUrl() {', documentationFunctions + '\n                    function readMarketplaceUrl() {', 'documentation modal functions');
          }

          if (!payload.includes("action === 'documentation'")) {
            payload = replaceOnce(
              payload,
              `                        if (action === 'code') {
                            showInstalledCode(sourceCard);
                            return;
                        }

                        if (action === 'preferences') {`,
              `                        if (action === 'code') {
                            showInstalledCode(sourceCard);
                            return;
                        }

                        if (action === 'documentation') {
                            showInstalledDocumentation(sourceCard);
                            return;
                        }

                        if (action === 'preferences') {`,
              'documentation action handler'
            );
          }

          payload = replaceOnce(
            payload,
            `                        if (isInstalledCatalog || isInstalled) {
                            addCloneAction(actions, 'More', MORE_ICON, 'more', sourceId);
                            addCloneAction(actions, 'Code', CODE_ICON, 'code', sourceId);

                            if (isKolex06VersionExtension(data) || sourceCardHasNativePreferences(sourceCard)) {
                                addCloneAction(actions, 'Preferences', SETTINGS_ICON, 'preferences', sourceId, true);
                            } else {
                                hasPreferencesForCard(sourceCard).then(hasPreferences => {
                                    if (!hasPreferences) return;
                                    if (!actions.isConnected) return;

                                    addCloneAction(actions, 'Preferences', SETTINGS_ICON, 'preferences', sourceId, true);
                                });
                            }
                        } else if (!isInstalled && liveButtons.length) {`,
            `                        if (isInstalledCatalog || isInstalled) {
                            addCloneAction(actions, 'Info', MORE_ICON, 'more', sourceId);
                            addCloneAction(actions, 'Code', CODE_ICON, 'code', sourceId);

                            hasDocumentationForCard(sourceCard).then(hasDocumentation => {
                                if (!hasDocumentation) return;
                                if (!actions.isConnected) return;

                                addCloneAction(actions, 'Documentation', DOCUMENTATION_ICON, 'documentation', sourceId);
                            });

                            if (isKolex06VersionExtension(data) || sourceCardHasNativePreferences(sourceCard)) {
                                addCloneAction(actions, 'Preferences', SETTINGS_ICON, 'preferences', sourceId);
                            } else {
                                hasPreferencesForCard(sourceCard).then(hasPreferences => {
                                    if (!hasPreferences) return;
                                    if (!actions.isConnected) return;

                                    addCloneAction(actions, 'Preferences', SETTINGS_ICON, 'preferences', sourceId);
                                });
                            }
                        } else if (!isInstalled && liveButtons.length) {`,
            'clone action order'
          );

          manifest.payload = payload;
          writeJson(manifestPath, manifest);
          writeJson(marketplacePath, marketplace);
          NODE

      - name: Commit changes and remove workflow
        run: |
          rm -f .github/workflows/update-seautils-full-catalog-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json .github/workflows/update-seautils-full-catalog-actions.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SeaUtils full catalog actions"
            git push
          fi
