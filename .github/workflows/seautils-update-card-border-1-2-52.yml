name: SeaUtils update card border 1.2.52

on:
  push:
    branches:
      - main
    paths:
      - marketplace.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-seautils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch SeaUtils update card border
        run: |
          cat > /tmp/update-seautils.js <<'NODE'
          const fs = require('fs');
          const manifestPath = 'plugins/SeaUtils-Kolex06-Version.json';
          const marketplacePath = 'marketplace.json';
          const workflowPath = '.github/workflows/seautils-update-card-border-1-2-52.yml';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          let payload = manifest.payload;

          const cssInsert = `
            body[data-ama-better-marketplace="true"] .group\\/extension-card[data-ama-update-available="true"],
            body[data-ama-better-marketplace="true"] .ama-catalog-card-wrap[data-ama-update-available="true"] > .group\\/extension-card {
                border-color: rgba(56, 189, 248, 0.95) !important;
                background: rgba(14, 165, 233, 0.12) !important;
                box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.75), 0 0 18px rgba(56, 189, 248, 0.2) !important;
            }

            body[data-ama-better-marketplace="true"] .group\\/extension-card[data-ama-update-available="true"]:hover,
            body[data-ama-better-marketplace="true"] .ama-catalog-card-wrap[data-ama-update-available="true"] > .group\\/extension-card:hover {
                background: rgba(14, 165, 233, 0.18) !important;
            }

`;
          if (!payload.includes('data-ama-update-available="true"')) {
            const cssPoint = payload.indexOf('body[data-ama-better-marketplace="true"] .ama-extension-carousel');
            if (cssPoint < 0) throw new Error('CSS insertion point not found');
            payload = payload.slice(0, cssPoint) + cssInsert + payload.slice(cssPoint);
          }

          const dataNeedle = `                    function getExtensionCardData(card) {
                        const paragraphs = Array.from(card.querySelectorAll('p')).map(p => p.textContent.trim()).filter(Boolean);
                        const badges = Array.from(card.querySelectorAll('.UI-Badge__root')).map(badge => badge.textContent.trim()).filter(Boolean);
                        const idEl = card.querySelector('.text-xs .opacity-30, [data-extension-id], [data-extension-card-id]');
                        const titleEl = card.querySelector('.font-semibold');

                        return {
                            id: (idEl && idEl.textContent.trim()) || '',
                            name: (titleEl && titleEl.textContent.trim()) || paragraphs[0] || 'Extension',
                            description: paragraphs[2] || paragraphs[1] || '',
                            version: badges[0] || '',
                            author: badges[1] || '',
                            language: badges[2] || '',
                        };
                    }
`;
          const dataReplacement = dataNeedle + `
                    function hasExtensionUpdateText(value) {
                        const text = String(value || '').trim();
                        if (!text) return false;

                        if (/[→⇒➜⟶]/.test(text) || /\s->\s/.test(text)) return true;

                        return /\bv?\d+(?:\.\d+){1,3}\s+(?:to|updated? to)\s+v?\d+(?:\.\d+){1,3}\b/i.test(text);
                    }

                    function markExtensionUpdateState(card) {
                        if (!card || !card.querySelectorAll) return false;

                        const badges = Array.from(card.querySelectorAll('.UI-Badge__root')).map(badge => badge.textContent.trim()).filter(Boolean);
                        const hasUpdate = hasExtensionUpdateText(badges[0] || '');

                        card.dataset.amaUpdateAvailable = hasUpdate ? 'true' : 'false';

                        const wrapper = card.closest('.ama-catalog-card-wrap');
                        if (wrapper) {
                            wrapper.dataset.amaUpdateAvailable = hasUpdate ? 'true' : 'false';
                        }

                        return hasUpdate;
                    }
`;
          if (!payload.includes('function markExtensionUpdateState(card)')) {
            if (!payload.includes(dataNeedle)) throw new Error('data function insertion point not found');
            payload = payload.replace(dataNeedle, dataReplacement);
          }

          const enhanceNeedle = `                    function enhanceExtensionCard(card) {
                        if (!featureSettings.betterMarketplace) return;
                        if (!card) return;

                        if (card.dataset.amaEnhanced && card.dataset.amaEnhanced !== marketplaceEnhancementVersion) {
`;
          const enhanceReplacement = `                    function enhanceExtensionCard(card) {
                        if (!featureSettings.betterMarketplace) return;
                        if (!card) return;

                        markExtensionUpdateState(card);

                        if (card.dataset.amaEnhanced && card.dataset.amaEnhanced !== marketplaceEnhancementVersion) {
`;
          if (!payload.includes('markExtensionUpdateState(card);\n\n                        if (card.dataset.amaEnhanced')) {
            if (!payload.includes(enhanceNeedle)) throw new Error('enhance insertion point not found');
            payload = payload.replace(enhanceNeedle, enhanceReplacement);
          }

          const cloneNeedle = `                                    const clone = item.cloneNode(true);
                                    const wrapper = document.createElement('div');
                                    wrapper.className = 'ama-catalog-card-wrap';
                                    clone.querySelectorAll('button').forEach(button => button.remove());
                                    optimizeImages(clone);

                                    wrapper.appendChild(clone);
`;
          const cloneReplacement = `                                    const clone = item.cloneNode(true);
                                    const wrapper = document.createElement('div');
                                    wrapper.className = 'ama-catalog-card-wrap';
                                    clone.querySelectorAll('button').forEach(button => button.remove());
                                    markExtensionUpdateState(clone);
                                    optimizeImages(clone);

                                    wrapper.appendChild(clone);
`;
          if (!payload.includes('markExtensionUpdateState(clone);')) {
            if (!payload.includes(cloneNeedle)) throw new Error('clone insertion point not found');
            payload = payload.replace(cloneNeedle, cloneReplacement);
          }

          manifest.payload = payload;
          manifest.version = '1.2.52';
          fs.writeFileSync(manifestPath, JSON.stringify(manifest), 'utf8');

          const marketplace = JSON.parse(fs.readFileSync(marketplacePath, 'utf8'));
          const item = marketplace.find(entry => entry.id === 'SeaUtils-Kolex06-Version');
          if (!item) throw new Error('marketplace SeaUtils entry not found');
          item.version = '1.2.52';
          fs.writeFileSync(marketplacePath, JSON.stringify(marketplace, null, 2) + '\n', 'utf8');

          if (fs.existsSync(workflowPath)) fs.unlinkSync(workflowPath);
          NODE
          node /tmp/update-seautils.js
      - name: Commit patched SeaUtils
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json .github/workflows/seautils-update-card-border-1-2-52.yml
          git commit -m "Update SeaUtils update card highlight" || exit 0
          git push
