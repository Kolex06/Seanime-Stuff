name: SeaUtils drag hotfix 1.2.25

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seautils-drag-hotfix-1-2-25.yml
      - tools/seautils_drag_hotfix_1_2_25.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-seautils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SeaUtils drag
        run: python3 tools/seautils_drag_hotfix_1_2_25.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtilsKolex06Version/provider.ts plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md
          git diff --cached --quiet || git commit -m "Fix SeaUtils drag scrolling"
          git push
