name: SeaUtils Search Page Detect 1.2.49

on:
  push:
    branches: [main]
    paths:
      - 'marketplace.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'plugins/SeaUtils-Kolex06-Version.json';
          const marketplacePath = 'marketplace.json';
          const workflowPath = '.github/workflows/seautils-search-page-detect-1-2-49.yml';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          let payload = manifest.payload;
          const oldSearch = `function hasSearchPageSignal() {
                        const path = String(window.location.pathname || '').toLowerCase();
                        const search = String(window.location.search || '').toLowerCase();
                        const hash = String(window.location.hash || '').toLowerCase();
                        const combined = path + ' ' + search + ' ' + hash;

                        if (/(^|[\\/#?&=-])search($|[\\/#?&=-])/.test(combined)) return true;
                        if (document.querySelector('[data-search-page-container], [data-search-page-title], [data-search-page-list]')) return true;

                        return false;
                    }`;
          const newSearch = `function hasSearchPageSignal() {
                        const path = String(window.location.pathname || '').toLowerCase();
                        const search = String(window.location.search || '').toLowerCase();
                        const hash = String(window.location.hash || '').toLowerCase();
                        const title = String(document.title || '').toLowerCase();
                        const combined = path + ' ' + search + ' ' + hash + ' ' + title;

                        if (/(^|[\\/#?&=-])search($|[\\/#?&=-])/.test(combined)) return true;
                        if (document.querySelector('[data-search-page-container], [data-search-page-title], [data-search-page-list], [data-search-page="true"], [data-media-search-page="true"]')) return true;
                        if (document.querySelector('input[placeholder*="Search anime"], input[placeholder*="Search Anime"], input[placeholder*="Search manga"], input[placeholder*="Search Manga"], input[placeholder*="Search media"], input[placeholder*="Search Media"], input[placeholder*="Search for anime"], input[placeholder*="Search for Anime"], input[placeholder*="Search for manga"], input[placeholder*="Search for Manga"]')) return true;

                        return false;
                    }`;
          if (payload.includes(oldSearch)) payload = payload.replace(oldSearch, newSearch);
          const oldProcess = `function processRoot(root) {
                        if (!root) return;

                        if (!featureSettings.betterMarketplace) {`;
          const newProcess = `function processRoot(root) {
                        if (!root) return;

                        setBodyFlags();

                        if (!featureSettings.betterMarketplace) {`;
          if (payload.includes(oldProcess)) payload = payload.replace(oldProcess, newProcess);
          manifest.version = '1.2.49';
          manifest.payload = payload;
          fs.writeFileSync(manifestPath, JSON.stringify(manifest), 'utf8');
          const marketplace = JSON.parse(fs.readFileSync(marketplacePath, 'utf8'));
          for (const item of marketplace) {
            if (item.id === 'SeaUtils-Kolex06-Version') item.version = '1.2.49';
          }
          fs.writeFileSync(marketplacePath, JSON.stringify(marketplace, null, 2) + '\n', 'utf8');
          fs.rmSync(workflowPath, { force: true });
          NODE
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json .github/workflows/seautils-search-page-detect-1-2-49.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix SeaUtils search carousel detection"
            git push
          fi
