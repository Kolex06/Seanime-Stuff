name: Fix SeaUtils Carousel Page Settings

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seautils-carousel-pages-fix.yml
      - .github/scripts/fix-seautils-carousel-pages.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-seautils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch SeaUtils carousel page settings
        run: node .github/scripts/fix-seautils-carousel-pages.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md .github/workflows/seautils-carousel-pages-fix.yml .github/scripts/fix-seautils-carousel-pages.js
          git commit -m "Fix SeaUtils carousel page settings"
          git push
