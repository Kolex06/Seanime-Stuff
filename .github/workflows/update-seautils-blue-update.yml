name: Update SeaUtils blue update UI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/update-seautils-blue-update.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write updated SeaUtils files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const files = {
            'plugins/SeaUtils-Kolex06-Version.json': '',
            'marketplace.json': ''
          };
          for (const [path, encoded] of Object.entries(files)) {
            fs.writeFileSync(path, zlib.gunzipSync(Buffer.from(encoded, 'base64')));
          }
          fs.rmSync('.github/workflows/update-seautils-blue-update.yml', { force: true });
          NODE
      - name: Commit update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json .github/workflows/update-seautils-blue-update.yml
          git commit -m "Update SeaUtils update indicators" || exit 0
          git push
