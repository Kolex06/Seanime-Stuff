name: Fix SeaUtils Full Catalog Actions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seautils-fullcatalog-fix.yml
      - .github/scripts/fix-seautils-fullcatalog.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-seautils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch SeaUtils inline manifest
        run: node .github/scripts/fix-seautils-fullcatalog.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md .github/workflows/seautils-fullcatalog-fix.yml .github/scripts/fix-seautils-fullcatalog.js
          git commit -m "Fix SeaUtils Full Catalog actions"
          git push
