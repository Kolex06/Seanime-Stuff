name: SeaUtils Search Carousel 1.2.40

on:
  push:
    paths:
      - ".github/workflows/seautils-search-carousel-1-2-40.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply fix
        run: node tools/fix-seautils-search-carousel-1-2-40.js
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SeaUtils-Kolex06-Version.json marketplace.json README.md tools/fix-seautils-search-carousel-1-2-40.js .github/workflows/seautils-search-carousel-1-2-40.yml
          git commit -m "Fix SeaUtils search carousel cleanup"
          git push
